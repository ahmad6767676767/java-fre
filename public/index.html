<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NovaBot AI</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <aside class="sidebar">
    <div class="brand">
      <div class="logo">N</div>
      <div>
        <strong>NovaBot</strong>
        <span>AI Assistant</span>
      </div>
    </div>

    <button id="newChat" class="new-chat">＋ New Chat</button>

    <div class="history-title">Recent Chats</div>
    <div id="history"></div>

    <div class="sidebar-bottom">
      <button id="themeBtn">🌙 Theme</button>
      <p>Built by Ahmad bin Shifa</p>
    </div>
  </aside>

  <main class="main">

    <header class="topbar">
      <button id="menuBtn" class="menu">☰</button>
      <div>
        <h2>NovaBot</h2>
        <span>Powered by Gemini</span>
      </div>
    </header>

    <section id="chat" class="chat">
      <div class="welcome">
        <div class="big-logo">N</div>
        <h1>How can I help you?</h1>
        <p>Ask NovaBot anything.</p>

        <div class="suggestions">
          <button>Explain something to me</button>
          <button>Help me write something</button>
          <button>Help me code</button>
          <button>Help me study</button>
        </div>
      </div>
    </section>

    <div class="input-area">
      <div class="input-box">
        <textarea
          id="message"
          placeholder="Message NovaBot..."
          rows="1"></textarea>

        <button id="send" class="send">➤</button>
      </div>

      <small>
        NovaBot can make mistakes. Check important information.
      </small>
    </div>

  </main>

  <script src="app.js"></script>
</body>
</html>
